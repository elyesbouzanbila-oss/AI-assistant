name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Rust cargo check
        run: cargo check -p alfred-core

      - name: Rust cargo test
        run: cargo test -p alfred-core

      - name: Rust cargo clippy (warnings are errors)
        run: cargo clippy -p alfred-core --all-targets -- -D warnings

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vite build
        run: npm run build

  # The only job that compiles platform/win.rs and platform/recorder.rs: the
  # Ubuntu job above builds the stub backend, and Tauri needs GTK/WebKit headers
  # there, so a workspace build belongs on a Windows runner.
  windows-build:
    name: Windows Build
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tauri::generate_context! reads frontendDist, so ../dist must exist.
      - name: Vite build
        run: npm run build

      - name: Rust cargo build (workspace)
        run: cargo build --workspace

  tauri-check:
    name: Tauri App Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Install front-end dependencies
        run: npm ci

      - name: Check Tauri build config
        run: |
          ls src-tauri/tauri.conf.json
          cat src-tauri/tauri.conf.json